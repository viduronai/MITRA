# Build the four images and deploy them to one environment's server.
#   push to main          -> staging (automatic, after CI passes)
#   "Run workflow" button -> staging / demo / production (demo + production: add required
#                            reviewers to those GitHub environments, so each deploy needs your OK)
#
# Per GitHub environment (Settings > Environments), set:
#   vars:    DOMAIN (e.g. staging.viduronai.in)
#   secrets: SSH_HOST, SSH_KEY (private key of the server's deploy user), SSH_KNOWN_HOSTS
#            (output of `ssh-keyscan <host>`)
# Secrets for the apps themselves stay on the server (/opt/mitra/.env, env/*.env).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, demo, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.environment || 'staging' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      matrix:
        include:
          - { name: core, file: deploy/docker/core.Dockerfile, app: "" }
          - { name: voice, file: deploy/docker/voice.Dockerfile, app: "" }
          - { name: web, file: deploy/docker/next.Dockerfile, app: web }
          - { name: marketing, file: deploy/docker/next.Dockerfile, app: marketing }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image prefix (ghcr needs lowercase)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          # The site URL is baked into the marketing build; the demo form posts same-origin.
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_SITE_URL=https://site.${{ vars.DOMAIN }}
            NEXT_PUBLIC_API_URL=
          tags: ${{ env.PREFIX }}/mitra-${{ matrix.name }}:${{ github.sha }}-${{ env.TARGET }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
      - name: Copy the stack files
        run: |
          scp -i ~/.ssh/id_deploy deploy/compose.yml deploy/Caddyfile deploy/postgres-init.sql \
            deploy/backup.sh "deploy@${{ secrets.SSH_HOST }}:/opt/mitra/"
      - name: Pull and restart (migrations run before the API starts)
        env:
          TAG: ${{ github.sha }}-${{ env.TARGET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "deploy@${{ secrets.SSH_HOST }}" \
            TAG="$TAG" OWNER="${GITHUB_REPOSITORY_OWNER,,}" ACTOR="${{ github.actor }}" \
            GHCR_TOKEN="$GHCR_TOKEN" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/mitra
          chmod 750 backup.sh
          sed -i "s|^MITRA_TAG=.*|MITRA_TAG=${TAG}|; s|^MITRA_IMAGE_PREFIX=.*|MITRA_IMAGE_PREFIX=ghcr.io/${OWNER}|" .env
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker compose --env-file .env pull --quiet
          docker compose --env-file .env up -d --remove-orphans
          docker compose --env-file .env ps --format '{{.Service}}: {{.Status}}'
          docker logout ghcr.io
          docker image prune -af --filter "until=168h" >/dev/null
          REMOTE
      - name: Smoke test
        run: |
          for url in "https://api.${{ vars.DOMAIN }}/health/ready" "https://${{ vars.DOMAIN }}/login" \
                     "https://site.${{ vars.DOMAIN }}/"; do
            curl -fsS -o /dev/null --retry 30 --retry-delay 10 --retry-all-errors "$url"
            echo "ok $url"
          done
